name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: curl, json
          coverage: none

      - run: composer install --no-progress --prefer-dist

      - run: composer test:unit

      - run: composer analyse

      - run: composer cs
